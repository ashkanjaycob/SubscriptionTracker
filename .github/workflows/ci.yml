name: CI Quality Checks

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

jobs:
  check-quality:
    name: Lint & Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check ESLint
        run: pnpm lint

      - name: Check Type & Build
        run: pnpm build
